<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mero Domestic Shoes</title>

<style>
body {margin:0;font-family:Arial;background:#f4f4f4}

/* NAV */
nav {
    background:#111;color:white;
    display:flex;justify-content:space-between;
    padding:15px;
}

/* HERO */
.hero {
    background:url('https://images.unsplash.com/photo-1542291026-7eec264c27ff') center/cover;
    color:white;text-align:center;padding:80px;
}

/* SEARCH */
.search {text-align:center;padding:20px;}
.search input {padding:10px;width:60%;}

/* PRODUCTS */
.products {
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:20px;padding:20px;
}

.card {
    background:white;padding:10px;border-radius:10px;
}

.card img {
    width:100%;height:200px;object-fit:cover;
}

button {
    background:#ff6600;color:white;border:none;
    padding:8px;margin-top:5px;cursor:pointer;
}

/* RATING */
.stars span {
    font-size:20px;
    cursor:pointer;
    color:gray;
}
.stars .active {
    color:gold;
}

/* COMMENTS */
.comment-box {
    margin-top:10px;
}
.comment-box input {
    width:100%;padding:5px;
}
.comment-list {
    font-size:12px;margin-top:5px;
}

/* CART */
.cart {
    position:fixed;right:0;top:0;
    width:250px;height:100%;
    background:white;padding:10px;
    overflow:auto;border-left:2px solid #ddd;
}

/* FOOTER */
footer {
    background:black;color:white;
    text-align:center;padding:10px;
}
</style>
</head>

<body>

<nav>
<h2>👟 Mero Shoes</h2>
<div>Cart 🛒</div>
</nav>

<div class="hero">
<h1>Best Shoes Collection</h1>
</div>

<div class="search">
<input id="searchBox" placeholder="Search shoes...">
</div>

<div class="products" id="products"></div>

<div class="cart">
<h3>Cart</h3>
<ul id="cartItems"></ul>
</div>

<footer>
<p>© 2026 Mero Domestic Shoes</p>
</footer>

<script>

// DIFFERENT IMAGES
const images = [
"https://images.unsplash.com/photo-1528701800489-20be3c76a96a",
"https://images.unsplash.com/photo-1519741497674-611481863552",
"https://images.unsplash.com/photo-1600180758890-6b94519a8ba6",
"https://images.unsplash.com/photo-1584735175097-719d848f8449",
"https://images.unsplash.com/photo-1560769629-975ec94e6a86"
];

// PRODUCTS
const shoes = [];
for(let i=1;i<=20;i++){
    shoes.push({
        name:"Shoe Model "+i,
        price:2000+i*100,
        image:images[i % images.length],
        rating:0,
        comments:[]
    });
}

const container = document.getElementById("products");
const cart = document.getElementById("cartItems");

// DISPLAY
function display(list){
    container.innerHTML="";
    list.forEach((s,i)=>{
        container.innerHTML += `
        <div class="card">
            <img src="${s.image}">
            <h3>${s.name}</h3>
            <p>Rs ${s.price}</p>

            <div class="stars" id="stars-${i}">
                ${[1,2,3,4,5].map(n=>`<span onclick="rate(${i},${n})">★</span>`).join("")}
            </div>

            <button onclick="addCart(${i})">Add to Cart</button>

            <div class="comment-box">
                <input placeholder="Write feedback..." onkeypress="addComment(event,${i})">
                <div class="comment-list" id="comments-${i}"></div>
            </div>
        </div>`;
    });
}

// CART
function addCart(i){
    let li=document.createElement("li");
    li.innerText=shoes[i].name+" Rs "+shoes[i].price;
    cart.appendChild(li);
}

// RATING
function rate(i,stars){
    shoes[i].rating=stars;
    let starDiv=document.getElementById("stars-"+i).children;
    for(let j=0;j<5;j++){
        starDiv[j].classList.toggle("active", j<stars);
    }
}

// COMMENTS
function addComment(e,i){
    if(e.key==="Enter"){
        shoes[i].comments.push(e.target.value);
        e.target.value="";
        updateComments(i);
    }
}

function updateComments(i){
    let div=document.getElementById("comments-"+i);
    div.innerHTML=shoes[i].comments.map(c=>"<p>"+c+"</p>").join("");
}

// SEARCH
document.getElementById("searchBox").addEventListener("keyup",function(){
    let val=this.value.toLowerCase();
    display(shoes.filter(s=>s.name.toLowerCase().includes(val)));
});

// INIT
display(shoes);

</script>

</body>
</html>
